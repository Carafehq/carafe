name: release

# Release channels, one job:
#   stable           — git tag v0.1.0 && git push origin v0.1.0
#   alpha            — every push to main releases v<package.json>-alpha.<short sha>,
#                      marked latest so install.sh and `carafe update` pick it up.
#                      Stable and alpha builds are both the `stable` channel.
#
# One Linux runner produces every artifact — `bun build --compile --target=...`
# downloads the target's runtime and embeds it, so no build matrix is needed.

on:
  push:
    tags: ["v*"]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Uploads a draft release."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # A broken build is worse than a late one — the release is gated on green.
      - run: bunx tsc --noEmit
      # The handoff render tests and the bench gates are heavy; on a slow runner they crossed Bun's
      # default 5 s per-test limit and failed as timeouts with every assertion correct. bunfig.toml's
      # [test] timeout is ignored by Bun 1.3, so the limit is set on the command line.
      - run: bun test --timeout 30000

      - name: Resolve version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          channel=stable
          base="$(jq -r .version package.json)"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            version="$VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            case $GITHUB_REF_NAME in
              main) version="$base-alpha.$(git rev-parse --short HEAD)" ;;
              *) echo "no release channel for branch $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi
          # Validate the version for this release.
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "${{ github.event_name }}" = push ]; then
            pattern='^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9a-f]{7,}$'
          else
            pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          printf '%s\n' "$version" | grep -Eq "$pattern" \
            || { echo "invalid release version for the $channel channel: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: bun run build
        env:
          CARAFE_VERSION: ${{ steps.v.outputs.version }}
          CARAFE_CHANNEL: ${{ steps.v.outputs.channel }}

      - name: Smoke-test the native binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          tar -xzf "dist/carafe-${VERSION}-linux-x64.tar.gz" -C /tmp
          if [ "$CHANNEL" = stable ]; then expected="carafe ${VERSION} (linux-x64)"; else expected="carafe ${VERSION} (linux-x64, ${CHANNEL})"; fi
          test "$(/tmp/carafe --version)" = "$expected"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          # A branch release's tag is created here; without a target GitHub puts
          # it on the default branch rather than the source commit.
          # Use the commit this run built (ignored when the tag exists).
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          # Explicit: releases/latest is the contract install.sh and
          # `carafe update` resolve, and it must advance on alpha releases too,
          # only for the stable channel.
          make_latest: ${{ github.event_name != 'workflow_dispatch' && steps.v.outputs.channel == 'stable' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            install.sh

  # The menu bar app rides the same release: a universal Carafe.app with the
  # CLI compiled in, zipped. Developer ID signing and notarization happen when
  # the secrets exist (MACOS_CERT_P12 base64 + MACOS_CERT_PASSWORD, and either
  # NOTARY_KEYCHAIN_PROFILE or NOTARY_APPLE_ID + NOTARY_TEAM_ID + NOTARY_PASSWORD);
  # without them the zip is ad-hoc signed and the release notes say so.
  app:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Import the Developer ID certificate (when provided)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "no certificate secret; ad-hoc signing"; exit 0; fi
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci /tmp/ci.keychain-db
          security set-keychain-settings -lut 21600 /tmp/ci.keychain-db
          security unlock-keychain -p ci /tmp/ci.keychain-db
          security import /tmp/cert.p12 -k /tmp/ci.keychain-db -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci /tmp/ci.keychain-db
          security list-keychains -d user -s /tmp/ci.keychain-db login.keychain-db
          identity="$(security find-identity -v -p codesigning /tmp/ci.keychain-db | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          echo "CARAFE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f /tmp/cert.p12

      - name: Build Carafe.app
        env:
          CARAFE_CHANNEL: ${{ needs.release.outputs.channel }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: apps/menubar/make-app.sh --release "${{ needs.release.outputs.version }}"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.release.outputs.channel != 'stable' }}
          make_latest: ${{ github.event_name != 'workflow_dispatch' && needs.release.outputs.channel == 'stable' }}
          files: |
            apps/menubar/dist/Carafe-*.zip
            apps/menubar/dist/Carafe-*.zip.sha256
