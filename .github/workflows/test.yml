name: test

# The release workflow only runs on pushes to main and on tags, so until now the first time Linux ran a
# new test was at the release gate. The 0.1.4 release failed there on four fixtures that passed on macOS
# (see #32). This runs the same gate on every pull request, before merge.
#
# Linux only, on purpose: that is where the gap was, and local development covers macOS.

on:
  pull_request:
  workflow_dispatch:

# Reads the code and nothing else. No secrets are used.
permissions:
  contents: read

# A new push to the same pull request supersedes the run before it.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14" # keep in step with release.yml

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      # Same command as the release gate. The per-test limit is on the command line because the heavy
      # handoff render tests and the bench gates cross Bun's 5 s default on a slow runner, and a
      # `[test] timeout` in bunfig.toml had no effect when probed.
      - run: bun test --timeout 30000

